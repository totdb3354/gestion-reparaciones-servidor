spring.application.name=gestion-reparaciones-servidor
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080

# ── Base de datos MariaDB ─────────────────────────────────────────────────────
# Desarrollo local (XAMPP): localhost:3306
# Produccion (VM): cambiar host a la IP de la VM
spring.datasource.url=jdbc:mariadb://localhost:3306/reparaciones
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── JWT ───────────────────────────────────────────────────────────────────────
# Cambiar jwt.secret por una cadena larga y aleatoria en produccion
jwt.secret=cambiar-esto-en-produccion-min-32-caracteres
jwt.expiration=86400000
